services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense_local_2026}
      POSTGRES_DB: expense_db
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["expense_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://expense:${POSTGRES_PASSWORD:-expense_local_2026}@db:5432/expense_db
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      NODE_ENV: development
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-only-access-secret-change-before-deploy-2026}
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "npm run migrate && npm start"
volumes:
  expense_data:
